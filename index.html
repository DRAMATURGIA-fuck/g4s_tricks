<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рандомайзер трюков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        /* Логотип вверху сбоку */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            z-index: 10;
            opacity: 0.9;
            pointer-events: none;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .slot-window {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-window::after {
            content: '';
            position: absolute;
            left: 10px;
            right: 10px;
            top: 120px;
            height: 60px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .slot-reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        .slot-item {
            height: 60px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s, font-size 0.2s, font-weight 0.2s;
        }

        .slot-item.center {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }

        .slot-item.near-1 {
            color: rgba(255, 255, 255, 0.7);
        }
        .slot-item.near-2 {
            color: rgba(255, 255, 255, 0.4);
        }

        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="G4S SIMPLE white.png" alt="Logo">
    </div>

    <div class="slot-window">
        <div class="slot-reel" id="reel"></div>
    </div>

    <div class="hint" id="hint">Нажми, чтобы крутить</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tricks = [
            // OTHERS
            "BUTTERFLY CROSS", "BUTTERFLY", "BACK COBRA", "COBRA", "REVERSE EAGLE", "2 WHEELS EAGLE", "Z-EAGLE",
            "TOE-TOE SPECIAL", "BRUSH", "HEEL-TOE SPECIAL", "EAGLE / EAGLE CROSS", "SWEEPERS",
            "EIGHT", "BACK EIGHT", "CRAZY LEGS", "STROLL / BACK STROLL", "CRAZY / DOUBLE CRAZY", "CHAP-CHAP / X", "MEGA SERIES", "NELSON / BACK NELSON",
            // SITTING
            "BACK TOE CHRISTIE", "TOE CHRISTIE", "BACK TEAPOT / BACK SUPERMAN", "TEA POT / SUPERMAN", "TOE FOOTGUN",
            "BACK SITTING COBRA", "BACK CHRISTIE", "SITTING COBRA", "CHRISTIE", "BACK FOOTGUN", "FOOTGUN",
            "SITTING HEEL-TOE BACK CROSS", "SITTING HEEL-TOE CROSS", "BACK SITTING HEEL-TOE SNAKE", "SITTING HEEL-TOE SNAKE",
            "SMALL CART / 5 WHEEL SITTING", "SITTING FISH",
            // JUMPING
            "FRONT TOE FOOTGUN KAZACHOK", "HEEL WIPER", "TOE WIPER", "FOOTGUN SPIN JUMP", "FOOTGUN WIPER",
            "BACK KAZACHOK", "KAZACHOK", "KAZACHOK SPIN", "FRONT WIPER", "WIPER", "FOOTSPIN JUMP", "X JUMP", "CRAB CROSS", "CRAB SERIES",
            // WHEELING
            "BACKWARD LEAF SERIES", "SIDE / FORWARD LEAF SERIES", "WHEELING SHIFTS / COUNTERSHIFTS SERIES", "WHEELING FLIP / DAYNIGHT SERIES",
            "BACK WHEELING", "FLAT SHIFTS / COUNTERSHIFTS SERIES", "FORWARD WHEELINGS", "FLAT SFLIP / DAYNIGHT SERIES",
            "BACK ONE FOOT", "TWO WHEELS BACK CROSS", "TWO WHEELS BACK SNAKE", "TWO WHEELS CROSS", "TWO WHEELS SNAKE",
            "ONE FOOT", "BACK SNAKE / BACK CROSS", "SNAKE / CROSS", "FISH",
            // SPINNING
            "BACK TOE CHRISTIE SPIN", "TOE CHRISTIE SPIN", "BACK TOE FOOTGUN SPIN", "TOE FOOTGUN SPIN", "BACK SEVEN", "ONE CONE BACK SEVEN",
            "ONE CONE TOE FOOTGUN SPIN", "SEVEN", "ONE CONE SEVEN", "FLAT BACK SEVEN", "FLAT SEVEN", "ONE CONE BACK KOREAN SPIN",
            "BACK KOREAN SPIN", "KOREAN SPIN", "BACK TWO WHEELS SPIN", "TWO WHEELS SPIN", "BACK J-TURN", "J-TURN", "TWO FEET SPIN", "TOTAL CROSS",
            "ITALIEN / VOLT", "CRAZY SUN / MEXICAN", "SUN / MABROUK"
        ];

        const reel = document.getElementById('reel');
        const hint = document.getElementById('hint');

        const ITEM_HEIGHT = 60;
        let isSpinning = false;

        const REPEATS = 50;
        let items = [];
        for (let i = 0; i < REPEATS; i++) {
            items = items.concat(tricks);
        }

        function renderItems() {
            reel.innerHTML = '';
            items.forEach((trick) => {
                const div = document.createElement('div');
                div.className = 'slot-item';
                div.textContent = trick;
                reel.appendChild(div);
            });
        }
        renderItems();

        let currentIndex = Math.floor(items.length / 2);
        currentIndex = currentIndex - (currentIndex % tricks.length);

        function updatePosition(index, animate = false) {
            if (animate) {
                reel.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.15, 1.0)';
            } else {
                reel.style.transition = 'none';
            }

            const offset = 120 - (index * ITEM_HEIGHT);
            reel.style.transform = `translateY(${offset}px)`;

            const children = reel.children;
            for (let i = 0; i < children.length; i++) {
                children[i].className = 'slot-item';
                const diff = i - index;
                if (diff === 0) {
                    children[i].classList.add('center');
                } else if (Math.abs(diff) === 1) {
                    children[i].classList.add('near-1');
                } else if (Math.abs(diff) === 2) {
                    children[i].classList.add('near-2');
                }
            }
        }

        updatePosition(currentIndex, false);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.03);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            hint.style.opacity = '0';

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const randomTrickIndex = Math.floor(Math.random() * tricks.length);
            const currentMod = currentIndex % tricks.length;
            let distance = randomTrickIndex - currentMod;
            if (distance <= 0) distance += tricks.length;

            const targetIndex = currentIndex + distance + (tricks.length * 5);

            updatePosition(targetIndex, true);

            let startTime = performance.now();
            let duration = 3000;
            let lastStepIndex = currentIndex;

            function ticking(now) {
                if (!isSpinning) return;
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / duration, 1);
                
                let easeProgress = 1 - Math.pow(1 - progress, 3);
                let currentAnimatedIndex = Math.round(currentIndex + (targetIndex - currentIndex) * easeProgress);

                if (currentAnimatedIndex !== lastStepIndex) {
                    lastStepIndex = currentAnimatedIndex;
                    playSound();
                    if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                }

                if (progress < 1) {
                    requestAnimationFrame(ticking);
                }
            }
            requestAnimationFrame(ticking);

            setTimeout(() => {
                currentIndex = targetIndex;
                isSpinning = false;
                hint.style.opacity = '1';
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }, duration);
        }

        document.body.addEventListener('click', spin);
    </script>
</body>
</html>
