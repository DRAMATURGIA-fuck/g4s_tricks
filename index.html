<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рандомайзер трюков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        /* Логотип вверху сбоку */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            z-index: 10;
            opacity: 0.9;
            pointer-events: none;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Кнопка настроек фильтров вверху справа */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s;
        }

        .settings-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Модальное окно фильтров */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 25px 20px;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal h2 {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .filter-section {
            margin-bottom: 20px;
        }

        .filter-section h3 {
            font-size: 14px;
            color: #888888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Переключатель языка */
        .lang-switch-container {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .lang-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #888888;
            padding: 8px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: #ffffff;
            color: #000000;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .filter-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .filter-item.disabled {
            opacity: 0.4;
            border-color: rgba(255, 255, 255, 0.05);
            background: rgba(255, 255, 255, 0.02);
        }

        .close-modal {
            margin-top: auto;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .slot-window {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-window::after {
            content: '';
            position: absolute;
            left: 10px;
            right: 10px;
            top: 120px;
            height: 60px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            pointer-events: none;
        }

        .slot-reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
        }

        .slot-item {
            height: 60px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 500;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            padding: 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.2s, font-size 0.2s, font-weight 0.2s;
        }

        .slot-item.center {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
        }

        .slot-item.near-1 {
            color: rgba(255, 255, 255, 0.7);
        }
        .slot-item.near-2 {
            color: rgba(255, 255, 255, 0.4);
        }

        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: #666666;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: opacity 0.3s;
        }

        .empty-warning {
            color: #ff555f;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 0 20px;
            display: none;
        }
    </style>
</head>

                closeModal: "Готово",
                hint: "Нажми, чтобы крутить",
                emptyWarning: "Выключены все фильтры! Включи хотя бы что-нибудь в настройках ⚙️",
                catPrefix: "Категория "
            },
            en: {
                modalTitle: "Settings",
                langTitle: "Language / Язык",
                familiesTitle: "Families",
                categoriesTitle: "Categories",
                closeModal: "Done",
                hint: "Tap to spin",
                emptyWarning: "All filters are disabled! Enable at least something in settings ⚙️",
                catPrefix: "Category "
            }
        };

        let disabledFamilies = JSON.parse(localStorage.getItem('g4s_disabled_families') || '[]');
        let disabledCategories = JSON.parse(localStorage.getItem('g4s_disabled_categories') || '[]');

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('g4s_lang', lang);
            
            // Кнопки языка
            document.getElementById('langRu').className = `lang-btn ${lang === 'ru' ? 'active' : ''}`;
            document.getElementById('langEn').className = `lang-btn ${lang === 'en' ? 'active' : ''}`;

            // Тексты интерфейса
            document.getElementById('modalTitle').textContent = uiText[lang].modalTitle;
            document.getElementById('langTitle').textContent = uiText[lang].langTitle;
            document.getElementById('familiesTitle').textContent = uiText[lang].familiesTitle;
            document.getElementById('categoriesTitle').textContent = uiText[lang].categoriesTitle;
            document.getElementById('closeModal').textContent = uiText[lang].closeModal;
            document.getElementById('hint').textContent = uiText[lang].hint;
            document.getElementById('emptyWarning').textContent = uiText[lang].emptyWarning;

            renderFilters();
            initReel();
        }

        const familiesFilterEl = document.getElementById('familiesFilter');
        const categoriesFilterEl = document.getElementById('categoriesFilter');

        function renderFilters() {
            familiesFilterEl.innerHTML = '';
            families.forEach(fam => {
                const isExcluded = disabledFamilies.includes(fam);
                const div = document.createElement('div');
                div.className = `filter-item ${isExcluded ? 'disabled' : ''}`;
                div.innerHTML = `<span>${fam}</span> <span>${isExcluded ? '✕' : '✓'}</span>`;
                div.onclick = () => {
                    if (isExcluded) {
                        disabledFamilies = disabledFamilies.filter(f => f !== fam);
                    } else {
                        disabledFamilies.push(fam);
                    }
                    localStorage.setItem('g4s_disabled_families', JSON.stringify(disabledFamilies));
                    renderFilters();
                    initReel();
                };
                familiesFilterEl.appendChild(div);
            });

            categoriesFilterEl.innerHTML = '';
            categories.forEach(cat => {
                const isExcluded = disabledCategories.includes(cat);
                const div = document.createElement('div');
                div.className = `filter-item ${isExcluded ? 'disabled' : ''}`;
                div.innerHTML = `<span>${uiText[currentLang].catPrefix}${cat}</span> <span>${isExcluded ? '✕' : '✓'}</span>`;
                div.onclick = () => {
                    if (isExcluded) {
                        disabledCategories = disabledCategories.filter(c => c !== cat);
                    } else {
                        disabledCategories.push(cat);
                    }
                    localStorage.setItem('g4s_disabled_categories', JSON.stringify(disabledCategories));
                    renderFilters();
                    initReel();
                };
                categoriesFilterEl.appendChild(div);
            });
        }

        // Управление модалкой
        const modal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').onclick = (e) => {
            e.stopPropagation();
            modal.classList.add('open');
        };
        document.getElementById('closeModal').onclick = () => {
            modal.classList.remove('open');
        };

        const reel = document.getElementById('reel');
        const hint = document.getElementById('hint');
        const emptyWarning = document.getElementById('emptyWarning');

        const ITEM_HEIGHT = 60;
        let isSpinning = false;
        let activeTricks = [];
        let items = [];
        let middleBlock = 0;
        let currentIndex = 0;

        function getFilteredTricks() {
            return allTricks.filter(t => !disabledFamilies.includes(t.family) && !disabledCategories.includes(t.category));
        }

        function initReel() {
            activeTricks = getFilteredTricks();

            if (activeTricks.length === 0) {
                emptyWarning.style.display = 'block';
                reel.style.display = 'none';
                hint.style.display = 'none';
                return;
            } else {
                emptyWarning.style.display = 'none';
                reel.style.display = 'flex';
                hint.style.display = 'block';
            }

            const REPEATS = 101;
            items = [];
            for (let i = 0; i < REPEATS; i++) {
                items = items.concat(activeTricks.map(t => t.name[currentLang]));
            }

            reel.innerHTML = '';
            items.forEach((trickName) => {
                const div = document.createElement('div');
                div.className = 'slot-item';
                div.textContent = trickName;
                reel.appendChild(div);
            });

            middleBlock = Math.floor(REPEATS / 2);
            currentIndex = middleBlock * activeTricks.length;
            updatePosition(currentIndex, false);
        }

        function updatePosition(index, animate = false) {
            if (animate) {
                reel.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.15, 1.0)';
            } else {
                reel.style.transition = 'none';
            }

            const offset = 120 - (index * ITEM_HEIGHT);
            reel.style.transform = `translateY(${offset}px)`;

            const children = reel.children;
            for (let i = 0; i < children.length; i++) {
                children[i].className = 'slot-item';
                const diff = i - index;
                if (diff === 0) {
                    children[i].classList.add('center');
                } else if (Math.abs(diff) === 1) {
                    children[i].classList.add('near-1');
                } else if (Math.abs(diff) === 2) {
                    children[i].classList.add('near-2');
                }
            }
        }

        // Инициализация при старте
        setLanguage(currentLang);

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.03);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.03);
        }

        function spin() {
            if (isSpinning || modal.classList.contains('open')) return;
            activeTricks = getFilteredTricks();
            if (activeTricks.length === 0) return;

            isSpinning = true;
            hint.style.opacity = '0';

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const currentTrickOffset = currentIndex % activeTricks.length;
            currentIndex = middleBlock * activeTricks.length + currentTrickOffset;
            updatePosition(currentIndex, false);

            const randomTrickIndex = Math.floor(Math.random() * activeTricks.length);
            let distance = randomTrickIndex - currentTrickOffset;
            if (distance <= 0) distance += activeTricks.length;

            const targetIndex = currentIndex + distance + (activeTricks.length * 5);

            setTimeout(() => {
                updatePosition(targetIndex, true);

                let startTime = performance.now();
                let duration = 3000;
                let lastStepIndex = currentIndex;

                function ticking(now) {
                    if (!isSpinning) return;
                    let elapsed = now - startTime;
                    let progress = Math.min(elapsed / duration, 1);
                    
                    let easeProgress = 1 - Math.pow(1 - progress, 3);
                    let currentAnimatedIndex = Math.round(currentIndex + (targetIndex - currentIndex) * easeProgress);

                    if (currentAnimatedIndex !== lastStepIndex) {
                        lastStepIndex = currentAnimatedIndex;
                        playSound();
                        if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                    }

                    if (progress < 1) {
                        requestAnimationFrame(ticking);
                    }
                }
                requestAnimationFrame(ticking);

                setTimeout(() => {
                    currentIndex = targetIndex;
                    isSpinning = false;
                    hint.style.opacity = '1';
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }, duration);
            }, 50);
        }

        document.body.addEventListener('click', (e) => {
            if (!modal.contains(e.target) && e.target !== document.getElementById('settingsBtn')) {
                spin();
            }
        });
    </script>
</body>
</html>
